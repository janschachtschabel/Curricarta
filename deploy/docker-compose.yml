# The whole service in small, on one machine: PostgreSQL with pgvector, MinIO as the object
# store, the migration and the vocabulary load run once, two API and two worker replicas, and
# the web server in front. From the repository root:
#
#   python deploy/make-secrets.py
#   (cd frontend && npm ci && npm run build)
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Then http://127.0.0.1:18080 serves the app; nothing else is published on the host (port 8000
# of a developer's machine may belong to another service). Secrets come as files (*_FILE), never
# as variables: no key of the developer's environment reaches a container, as none is named here.
# `docker compose -f deploy/docker-compose.yml down` stops it and keeps the data; `down -v` also
# removes the volumes of this project (curricarta) - the database and the objects. No Valkey or Redis: the
# rate limits of the accounts are rows in PostgreSQL (M1), shared by every replica.
name: curricarta

# Bounds of every service: memory (a tmpfs counts against it: what lies in /tmp is memory), processes
# and threads, /tmp, and the logs Docker keeps (10 MB x 3 per container). Not measured under load.
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

# The one-off steps take these as they are (512m); api and worker set their own
x-app: &app
  image: curricarta-api:local
  read_only: true
  tmpfs: ["/tmp:size=64m"]
  mem_limit: 512m
  pids_limit: 256
  logging: *logging
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  secrets: [database_url, api_key_pepper, s3_access_key, s3_secret_key]
  environment: &app-env
    DATABASE_URL_FILE: /run/secrets/database_url
    API_KEY_PEPPER_FILE: /run/secrets/api_key_pepper
    STORAGE_BACKEND: s3
    S3_ENDPOINT_URL: http://minio:9000
    S3_BUCKET: curricarta
    S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
    S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
    LOG_FORMAT: json
    # for API and worker alike, here and never under one of them (both restarted after a change):
    # LLM_MAX_OUTPUT_TOKENS: "16000"

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_USER: curricarta
      POSTGRES_DB: curricarta
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    tmpfs: ["/tmp:size=64m"]
    mem_limit: 1g
    pids_limit: 256           # a process per connection: above max_connections (100)
    logging: *logging
    restart: unless-stopped
    healthcheck:
      # over TCP: on the first start the entrypoint makes the database on a socket-only server,
      # and pg_isready over the socket would say healthy while port 5432 is still closed
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U curricarta -d curricarta"]
      interval: 5s
      timeout: 3s
      retries: 20

  # MinIO publishes no community images since October 2025; this is Chainguard's build of it.
  # In a cluster the object store is T6's (S3_ENDPOINT_URL, S3_BUCKET in the Helm values).
  minio:
    image: cgr.dev/chainguard/minio@sha256:fe57367a6bfc78779367b86ad0cdd3d5df32965b7cb3c000c94032f138627c41
    command: [server, /data]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/s3_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/s3_secret_key
    secrets: [s3_access_key, s3_secret_key]
    volumes: [miniodata:/data]
    tmpfs: ["/tmp:size=64m"]
    mem_limit: 512m
    pids_limit: 256
    logging: *logging
    restart: unless-stopped

  # One-off steps: each runs to its end, the services wait for that
  bucket:
    <<: *app
    command: [python, -m, app.core.storage_bucket]
    healthcheck: {disable: true}
    depends_on: [minio]
    # MinIO may still be starting on the first attempt
    restart: on-failure:5

  migrate:
    <<: *app
    command: [python, -m, app.db.migrate]
    healthcheck: {disable: true}
    depends_on:
      postgres: {condition: service_healthy}

  vocab:
    <<: *app
    command: [python, -m, app.vocab.load]
    healthcheck: {disable: true}
    depends_on:
      migrate: {condition: service_completed_successfully}

  api:
    <<: *app
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    environment:
      <<: *app-env
      # the web server is the only proxy: its address alone, not the network, which holds the
      # gateway every connection to the published port comes from
      FORWARDED_ALLOW_IPS: 172.30.123.10
      # a statement of a request past it is cancelled (500); 2 s the longest on the tests' synthetic data
      DB_STATEMENT_TIMEOUT_S: "60"
    # uploads lie in /tmp while the API checks them: MAX_CONCURRENT_UPLOADS x (MAX_UPLOAD_MB + 1) MiB,
    # 102 MiB by default, in memory as the tmpfs is
    tmpfs: ["/tmp:size=256m"]
    mem_limit: 768m
    deploy:
      replicas: 2
    restart: unless-stopped
    # the image's check, asked more often: the web server waits for the first healthy one
    healthcheck:
      interval: 5s
    depends_on:
      migrate: {condition: service_completed_successfully}
      bucket: {condition: service_completed_successfully}

  worker:
    <<: *app
    command: [python, -m, app.jobs.worker]
    # pdfplumber's conversion keeps the file in /tmp meanwhile (up to MAX_UPLOAD_MB)
    tmpfs: ["/tmp:size=256m"]
    mem_limit: 1g
    # the image's check: the worker answers /health on its internal port while its loop turns
    deploy:
      replicas: 2
    # it ends with an error when its sweeper breaks, for a supervisor to start it again
    restart: unless-stopped
    # JOB_SHUTDOWN_GRACE_S (20 s) for the job, then the hand-back and up to 5 s for reservations
    # handed back (8 s beside the grace in all); Docker's default of 10 s would
    # kill a busy worker, and its job would wait for the lease to end
    stop_grace_period: 30s
    depends_on:
      migrate: {condition: service_completed_successfully}
      bucket: {condition: service_completed_successfully}

  # The sweep of what is past its time (python -m app.retention), only when asked - from the operator's
  # timer, daily:
  #   docker compose -f deploy/docker-compose.yml --profile retention run --rm -T retention
  # Its own secrets and environment: the anchor's would hand it the pepper. The store's settings are the
  # anchor's (a sweep without the store would forget its notes and leave the objects); RETENTION_*
  # (0 keeps everything) are set here, the one service that reads them
  retention:
    <<: *app
    profiles: [retention]
    command: [python, -m, app.retention]
    secrets: [database_url, s3_access_key, s3_secret_key]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: curricarta
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      LOG_FORMAT: json
      # RETENTION_RAW_ANSWERS_DAYS: "30"
    healthcheck: {disable: true}
    # beside the running service: the one-off steps are not run again for it
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_started}

  web:
    image: curricarta-web:local
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    read_only: true
    # The edge buffers each request body whole in /tmp before the API sees it (an upload up to
    # MAX_UPLOAD_MB and its form), and spools there too what an answer brings faster than the client
    # takes it (a file's download, an export); the tmpfs counts against the memory limit: room for the
    # API's two uploads at once, the limit above it. Uploads and downloads share it: a third large upload
    # or a large download beside two can fail here, with nginx's own answer rather than the API's JSON.
    # (In a cluster the ingress buffers; the pod keeps 64Mi.)
    tmpfs: ["/tmp:size=192m"]
    mem_limit: 256m
    pids_limit: 256
    logging: *logging
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:18080:8080"]
    # the proxy to the API, in place of the image's 404 for /api
    volumes: ["./nginx-api.conf:/etc/nginx/curricarta/api.conf:ro"]
    restart: unless-stopped
    networks:
      # a fixed address: the API trusts it alone to name the client (FORWARDED_ALLOW_IPS)
      default: {ipv4_address: 172.30.123.10}
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata:
  miniodata:

secrets:
  db_password: {file: ./secrets/db_password}
  database_url: {file: ./secrets/database_url}
  api_key_pepper: {file: ./secrets/api_key_pepper}
  s3_access_key: {file: ./secrets/s3_access_key}
  s3_secret_key: {file: ./secrets/s3_secret_key}

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.123.0/24
          # the addresses Docker hands out, apart from the web server's fixed one below .128
          ip_range: 172.30.123.128/25
