# The API part of the web server in Compose (mounted over the image's nginx-api-off.conf): /api
# and the spec go to the service "api". Docker's DNS is asked at each request: "api" names every
# replica, and a replica made anew has a new address, which nginx would otherwise keep from its
# start and answer 502 for.
resolver 127.0.0.11 valid=10s ipv6=off;
set $api http://api:8000;

# Here once, for both locations: a location with a proxy_set_header of its own drops these.
# This server is the only edge in Compose: it states the client rather than appending to an
# X-Forwarded-For the client sent, which the API (it trusts this server) would take as the address.
# with the port: FastAPI builds its redirect for a trailing slash from Host, and $host has none
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# The API sets these itself, for a cluster; behind this server the server's own go out, once
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;

location /api/ {
    proxy_pass $api;
    # uploads: 50 MB per file (MAX_UPLOAD_MB) and the form around it
    client_max_body_size 60m;
    # jobs run in the worker, requests here stay short; the deadline lies past the API's own
    # DB_STATEMENT_TIMEOUT_S (60 s) with a margin, as the Helm example's ingress: the API's answer (a 500
    # for a cancelled statement, the MEM export's 503) reaches the client rather than nginx's 504
    proxy_read_timeout 75s;
    # 50 a second per address (the zone in deploy/nginx.conf), bursts of 100 served at once; past them
    # 429 with nginx's own body, not the API's JSON. Behind Compose's port on 127.0.0.1 (or a proxy on the
    # host) every client arrives from one address: the limit then holds for the whole instance
    limit_req zone=api burst=100 nodelay;
    limit_req_status 429;
}

location = /openapi.json {
    proxy_pass $api;
}
