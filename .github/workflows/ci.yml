# Every check of the repository on each push to main and each pull request, or by hand for any
# branch: the ontology, the backend (lint, types; tests against PostgreSQL and MinIO in two parts,
# their coverage combined), the frontend (tests, lint, types, build) and both images, with a smoke
# test of the whole service in Compose. Actions are pinned by commit (a tag can be moved); the
# comment names the version.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # a test branch is checked by hand: a push alone starts nothing there
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # a newer push to a pull request replaces its run; a run on main always ends
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # lint, format, types and the ontology, once; the tests run beside it in two parts
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.7.13"   # the version that wrote uv.lock
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: Ontology check
        run: .venv/bin/python -I ../ontology/pruefung/pruefe.py
      # deploy/make-secrets.py runs in the smoke test below; ruff takes the backend's settings for it
      - run: .venv/bin/python -m ruff check --config pyproject.toml app tests ../deploy/make-secrets.py
      - run: .venv/bin/python -m ruff format --check --config pyproject.toml app tests ../deploy/make-secrets.py
      - run: .venv/bin/python -m mypy app tests ../deploy/make-secrets.py

  # The tests in two parts at once, each with a database and an object store of its own, split by the
  # time their folders took locally (2026-11-14: about 11 minutes each); tests/deploy/test_ci.py holds
  # that every folder and top-level test file runs in exactly one part.
  backend-tests:
    runs-on: ubuntu-24.04
    # the single job took 21-24 minutes, its tests 15-20 (2026-11-14); a part about half: the limit
    # allows twice that, for a slower runner, without hiding a hang
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 1
            paths: >-
              tests/pipeline tests/db tests/sources tests/lexicon tests/domain tests/usage tests/llm
              tests/test_support.py tests/test_serve.py tests/test_preloaded_vocabulary_guard.py
          - part: 2
            paths: >-
              tests/api tests/jobs tests/core tests/vocab tests/conversion tests/exports tests/deploy
              tests/test_bootstrap.py tests/test_version.py
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: curricarta
          POSTGRES_PASSWORD: curricarta-test
          POSTGRES_DB: curricarta
        ports: ["55432:5432"]
        # over TCP: the first start's socket-only server would count as healthy
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U curricarta -d curricarta" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # invented credentials of the test services; CI=true makes their tests required
      CURRICARTA_TEST_DATABASE_URL: postgresql://curricarta:curricarta-test@127.0.0.1:55432/curricarta
      CURRICARTA_TEST_S3_URL: http://127.0.0.1:59000
      CURRICARTA_TEST_S3_ACCESS_KEY: curricarta-test
      CURRICARTA_TEST_S3_SECRET_KEY: curricarta-test-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.7.13"   # the version that wrote uv.lock
          python-version: "3.13"
          enable-cache: true
      # MinIO publishes no community images since October 2025: Chainguard's build, as in Compose.
      # A step, not a service: a service container cannot be given its command (server /data).
      - name: Start the test object store
        run: >-
          docker run -d --name curricarta-test-minio -p 127.0.0.1:59000:9000
          -e MINIO_ROOT_USER=curricarta-test -e MINIO_ROOT_PASSWORD=curricarta-test-secret
          --tmpfs /data:rw,uid=65532,gid=65532
          cgr.dev/chainguard/minio@sha256:fe57367a6bfc78779367b86ad0cdd3d5df32965b7cb3c000c94032f138627c41
          server /data
      - run: uv sync --frozen
      - name: Wait for the test object store
        run: for i in $(seq 1 30); do curl -sf --max-time 2 http://127.0.0.1:59000/minio/health/ready && exit 0; sleep 1; done; exit 1
      # each part keeps its data (.coverage.<host>.<pid>.<random>, the processes the tests start
      # theirs beside it); the floor holds for both together, in backend-coverage
      - run: .venv/bin/python -m coverage run --parallel-mode --source=app -m pytest ${{ matrix.paths }}
      # file names and line numbers measured, nothing of the tests' data
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.part }}
          path: backend/.coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # both parts' coverage together, against fail_under in pyproject.toml
  backend-coverage:
    needs: backend-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.7.13"   # the version that wrote uv.lock
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
          path: backend
      - run: .venv/bin/python -m coverage combine
      # the floor is fail_under in pyproject.toml
      - run: .venv/bin/python -m coverage report --show-missing --skip-covered

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build   # vue-tsc -b, then vite build

  images:
    needs: [backend, backend-tests, backend-coverage, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the SPA for the web image
        run: cd frontend && npm ci && npm run build
      - name: Build the images
        run: |
          docker build -f deploy/api.Dockerfile -t curricarta-api:local .
          docker build -f deploy/web.Dockerfile -t curricarta-web:local .
          docker image ls curricarta-api:local --format 'api {{.Size}}'
          docker image ls curricarta-web:local --format 'web {{.Size}}'
      - name: Smoke test of the whole service
        run: |
          python3 deploy/make-secrets.py
          docker compose -f deploy/docker-compose.yml up -d
          for i in $(seq 1 60); do
            if curl -sf --max-time 5 http://127.0.0.1:18080/api/v1/info; then echo; ok=1; break; fi
            sleep 2
          done
          docker compose -f deploy/docker-compose.yml ps -a
          test "${ok:-0}" = 1
          # no service waits for the vocabulary load, so up -d stays green when it fails; docker wait, not
          # compose wait: the runner's Compose found no container once the load had ended (2026-10-30)
          test "$(docker wait "$(docker compose -f deploy/docker-compose.yml ps -aq vocab)")" = 0
          test "$(docker compose -f deploy/docker-compose.yml ps -q --status running worker | wc -l)" = 2
          # restart: unless-stopped brings a crashing worker back: each must run without a restart
          for worker in $(docker compose -f deploy/docker-compose.yml ps -q worker); do
            test "$(docker inspect -f '{{.State.Status}} {{.RestartCount}}' "$worker")" = "running 0"
          done
          # /info needs no database; /ready asks it and the migrations, on each replica's internal port
          ready="import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/ready', timeout=5)"
          docker compose -f deploy/docker-compose.yml exec -T --index 1 api python -c "$ready"
          docker compose -f deploy/docker-compose.yml exec -T --index 2 api python -c "$ready"
          # a trace id the client sends shows in the API's log line of the request
          trace="smoke-$(date +%s)"
          curl -sf --max-time 5 -H "x-client-trace-id: $trace" -o /dev/null http://127.0.0.1:18080/api/v1/info
          for i in $(seq 1 5); do
            if docker compose -f deploy/docker-compose.yml logs api | grep -qF "$trace"; then traced=1; break; fi
            sleep 1
          done
          test "${traced:-0}" = 1
      - name: Logs of the smoke test
        if: always()
        run: docker compose -f deploy/docker-compose.yml logs --no-color | tail -200
      - name: Stop the smoke test
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
